# NowRx — first-party published packages
#
# NowRx Inc. wound down in November 2022 (Alto Pharmacy took the California pharmacy
# patient business effective 2022-11-30; Capsule took the Arizona patient files), and
# nowrx.com is no longer the company's domain — see ../apis.yml x-coverage. The public
# npm registry outlives both, so its metadata is the only provider-published, reliably
# dated evidence left about this company's engineering surface.
#
# OWNERSHIP: the `@nowrx` npm scope is unambiguously first-party — a scope on npm can
# only be published to by the org that owns it, and both packages carry
# `repository: github.com/NowRx/<repo>`, the company's own GitHub organization
# (github.com/NowRx, org id 12887563, created 2015-06-15).
#
# NOTE ON THE REPOSITORY LINKS: both `github.com/NowRx/*` repository URLs now 301 to
# `github.com/Ameripharma/*` (org id 136115942, created 2023-06-09, blog
# ameripharma.us). GitHub preserves redirects across a repository TRANSFER, so these two
# repositories were moved out of the NowRx org to AmeriPharma — a separate specialty
# pharmacy — after NowRx wound down. The NowRx org itself still exists and is a distinct
# account, but it now holds ZERO public repositories. The npm packages themselves were
# never re-scoped and remain published under @nowrx.

