  pharmacy marketing site was still archived at that address as late as 2023-10; by
  2024-01-02 the domain served a fresh WordPress install, and it now runs a health/wellness
  SEO content site ("Nowrx - Trusted Health Insights", first post dated 2023-12-25, 35
  posts) whose own About page says "NowRx is a health and wellness website" and lists a
  contact address at shantel.co. Registrant is Domains By Proxy. Its stock WordPress REST
  API at /wp-json/ is the content site's, not NowRx's, and is deliberately not recorded as
  an API surface for this company.
