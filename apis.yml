aid: nowrx
name: NowRx
image: https://avatars.githubusercontent.com/u/12887563?v=4
description: >-
  NowRx Inc. was a Silicon Valley technology-enabled pharmacy that paired proprietary
  prescription-fulfilment software (marketed as QuickFill), robotic dispensing inside
  low-overhead micro-fulfilment centers, and its own last-mile courier fleet to offer
  free same-day and same-hour delivery of prescription medications across California and
  Arizona. Founded in 2015 and led by co-founder and CEO Cary Breese, it raised roughly
  $30M — an unusually large share of it from retail investors through SeedInvest equity
  crowdfunding — and was last marked at about a $275M valuation before running out of
  money. The company wound down in late 2022: Alto Pharmacy acquired its California
  pharmacy patient business effective 2022-11-30 and Capsule took its Arizona patient
  files, with patients transferred automatically. NowRx never operated a public developer
  program. No api., developer., docs. or app. host under nowrx.com resolves or has ever
  been archived, its GitHub organization now holds zero public repositories, and the only
  surviving first-party engineering artifacts are two npm packages under the @nowrx scope
  — both vendored forks of third-party React Native libraries, last published in January
  2022. The nowrx.com domain is no longer the company's: since late December 2023 it has
  served an unrelated WordPress health-content site under registrar privacy, so it is
  deliberately NOT wired here as a Website pointer. This profile is retained as a
  historical company record.
